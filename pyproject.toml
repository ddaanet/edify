# Dev tooling only; nothing here is a Python package. `uv sync` materializes
# `.venv/bin`, which `.envrc` puts on PATH. The tools run on the venv's
# Python; the plugin's scripts run on the system python3, standard library only,
# from 3.9, which ruff's `per-file-target-version` holds them to.
[project]
name = "edify-dev"
version = "0"
requires-python = ">=3.14"

[dependency-groups]
dev = ["rumdl==0.2.74", "pytest==9.0.2", "ruff==0.15.5", "mypy==1.19.1"]

[tool.uv]
package = false

[tool.ruff]
extend-include = ["bin/edify-markdown", "bin/edify-count-tokens"]
exclude = [".claude", "plans/prototypes"]
output-format = "concise"
unsafe-fixes = true

[tool.ruff.per-file-target-version]
"bin/**" = "py39"
"lib/**" = "py39"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",     # no blank line required before class docstring
    "D213",     # multi-line docstring summary should start at the first line
    "S603",     # subprocess call
    "S607",     # partial executable path
    "PLR2004",  # Magic value used in comparison
    "EM",       # Error message can be duplicated in traceback, no problem.
    "TD002",    # missing-todo-author
    "TD003",    # missing-todo-link
    "FIX",      # FIXME comments should not cause failure
    "S101",     # Authorize assert
    "T201",     # Authorize print
    "T203",     # Authorize pprint

    "D209",     # Multi-line docstring closing quotes should be on a separate line

    # Rules that should be disabled when using ruff as a formatter.
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",     # tab-indentation
    "E111",     # indentation-with-invalid-multiple
    "E114",     # indentation-with-invalid-multiple-comment
    "E117",     # over-indented
    "D206",     # docstring-tab-indentation
    "D300",     # triple-single-quotes
    "Q000",     # bad-quotes-inline-string
    "Q001",     # bad-quotes-multiline-string
    "Q002",     # bad-quotes-docstring
    "Q003",     # avoidable-escaped-quote
    "COM812",   # missing-trailing-comma
    "COM819",   # prohibited-trailing-comma
    "ISC002",   # multi-line-implicit-string-concatenation
    "TC001",    # typing-only-first-party-import
    "TC002",    # typing-only-third-party-import
    "TC003",    # typing-only-standard-library-import
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # Assert statements
    "ARG",      # Unused function arguments
    # "FBT",    # Ignore boolean traps in test parameters
    "SLF001",   # Private member accessed
    "TRY003",   # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
scripts_are_modules = true
files = ["bin/edify-markdown", "bin/edify-count-tokens", "lib", "tests"]
strict = true
extra_checks = true
error_summary = false
# Turn on experimental option
# https://mypy.readthedocs.io/en/stable/config_file.html#confval-allow_redefinition_new
allow_redefinition_new = true
local_partial_types = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
strict = true
testpaths = ["tests"]
addopts = "--no-header --tb=short"
